[project]
name = "noise-filter"
version = "0.2.0"
description = "Realtime low-latency microphone noise filter with frequency analyzer (Windows)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
ai = ["onnxruntime>=1.17"]
ui = ["PySide6>=6.6", "pyqtgraph>=0.13"]
dev = ["pytest", "scipy"]

[project.scripts]
noise-filter = "noise_filter.cli:main"

[tool.setuptools.packages.find]
include = ["noise_filter*"]

[tool.setuptools.package-data]
noise_filter = ["i18n/*.json", "assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
