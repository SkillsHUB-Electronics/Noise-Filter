name: Sample intake Worker

# Tests the Cloudflare Worker that receives noise samples, and deploys it from the default
# branch once the Cloudflare secrets are set (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID).
# The review page password comes from the secret REVIEW_PASSWORD (at least 12 characters).
on:
  push:
    paths: ["cloud/worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["cloud/worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set yet; skipping deploy."
            exit 0
          fi
          npx --yes wrangler@4 deploy
      - name: Set the review page password
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REVIEW_PASSWORD: ${{ secrets.REVIEW_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          if [ -z "$REVIEW_PASSWORD" ]; then
            echo "::warning::GitHub secret REVIEW_PASSWORD is not set: the /review page stays locked."
            exit 0
          fi
          printf '%s' "$REVIEW_PASSWORD" | npx --yes wrangler@4 secret put REVIEW_PASSWORD
      - name: Smoke test the deployed Worker
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          URL=https://noise-filter-samples.mukhamadkhoirul.workers.dev
          sleep 5
          curl -fsS "$URL/v1/health"; echo
          node test/smoke.mjs "$URL"
