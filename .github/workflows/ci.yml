name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build nf-core (MSVC)
        run: |
          cmake -S cpp -B cpp/build -A x64
          cmake --build cpp/build --config Release
      - name: C++ tests
        run: ctest --test-dir cpp/build -C Release --output-on-failure
      - name: Install DLL next to the Python package
        run: cmake --install cpp/build --config Release
      - name: Python tests (parity C++ vs Python)
        run: |
          pip install -e .[dev] onnx onnxruntime
          python -m pytest -q
      - name: CLI smoke test
        run: |
          noise_filter/_native/nf-cli.exe bench
          noise_filter/_native/nf-cli.exe devices
      - uses: actions/upload-artifact@v4
        with:
          name: nf-core-windows-x64
          path: |
            noise_filter/_native/nf_core.dll
            noise_filter/_native/nf-cli.exe

  linux-onnx:
    runs-on: ubuntu-latest
    env:
      ORT_VERSION: "1.20.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download ONNX Runtime
        run: |
          curl -sSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz
          tar xzf ort.tgz
      - name: Build nf-core with ONNX
        run: |
          cmake -S cpp -B cpp/build -DNF_WITH_ONNX=ON -DONNXRUNTIME_DIR=$PWD/onnxruntime-linux-x64-${ORT_VERSION}
          cmake --build cpp/build -j
      - name: C++ tests
        run: ctest --test-dir cpp/build --output-on-failure
      - name: Python tests (parity incl. ONNX)
        run: |
          pip install -e .[dev] onnx onnxruntime
          NF_CORE_LIB=$PWD/cpp/build/libnf_core.so python -m pytest -q
